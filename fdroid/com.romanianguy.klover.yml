# Draft of the F-Droid recipe (it lives in https://gitlab.com/fdroid/fdroiddata as metadata/com.romanianguy.klover.yml, sent as a merge request, not read from this repository).
# The build line is for the first release that has the -PkloverFdroid switch (v1.2); fill in the real numbers when it is tagged.
Categories:
  - Reading
License: Apache-2.0
AuthorName: AnRomanianGuy
WebSite: https://github.com/AnRomanianGuy/Klover-Kavita-Android
SourceCode: https://github.com/AnRomanianGuy/Klover-Kavita-Android
IssueTracker: https://github.com/AnRomanianGuy/Klover-Kavita-Android/issues
Changelog: https://github.com/AnRomanianGuy/Klover-Kavita-Android/releases

AutoName: Klover

RepoType: git
Repo: https://github.com/AnRomanianGuy/Klover-Kavita-Android.git

Builds:
  - versionName: '1.2'
    versionCode: 3
    commit: v1.2
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes
    gradleprops:
      - kloverFdroid=true
    # the build asks for a specific JDK from foojay (a binary download), the store's own JDK is used instead
    prebuild:
      - rm -f ../gradle/gradle-daemon-jvm.properties
      - sed -i -e '/foojay-resolver-convention/d' ../settings.gradle.kts

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: '1.2'
CurrentVersionCode: 3
